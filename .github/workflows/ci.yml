name: CI

on:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit of the coverage badges on main
    strategy:
      matrix:
        node-version: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run coverage
      - name: Coverage summary and badges
        if: matrix.node-version == 22
        run: node .github/scripts/coverage-badges.cjs --badges .github/badges >> "$GITHUB_STEP_SUMMARY"
      # The README badges live in the repo itself (no external service). They only
      # change with main's coverage, and the commit carries [skip ci] so it does not
      # trigger this workflow again.
      - name: Commit coverage badges
        if: matrix.node-version == 22 && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git add .github/badges
          if git diff --cached --quiet; then
            echo "Badges unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update coverage badges [skip ci]"
          git push origin HEAD:main
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        if: matrix.node-version == 22
        with:
          name: plugin-jpl
          path: publish/*.jpl
