name: CI

on:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run coverage
      # The README badges live in the repo and are committed together with the code
      # (`npm run validate` regenerates them). The CI only checks they are current,
      # so nothing needs to push to main.
      - name: Coverage summary and badges
        if: matrix.node-version == 22
        run: |
          npm run --silent badges >> "$GITHUB_STEP_SUMMARY"
          git diff --exit-code -- .github/badges || { echo "::error::Coverage badges are outdated; run 'npm run validate' and commit .github/badges"; exit 1; }
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        if: matrix.node-version == 22
        with:
          name: plugin-jpl
          path: publish/*.jpl
